# GitHub Actions: deploy the model deployments, gate the release on an evaluation, then promote.
# Copy to .github/workflows/ in a repository. It signs in with OpenID Connect (no secrets): create a federated
# credential on an Entra app registration for this repository, and give it Contributor on the resource group and
# Cognitive Services OpenAI User on the AI resource.
name: foundry-deploy

on:
  push:
    branches: [main]
    paths: ["examples/foundry-cicd/**"]
  workflow_dispatch:

permissions:
  id-token: write   # OpenID Connect token for azure/login
  contents: read

env:
  RESOURCE_GROUP: rg-llm-lab
  AI_RESOURCE: ai-llm-lab-0eevth

jobs:
  deploy-and-gate:
    runs-on: ubuntu-latest
    environment: staging   # an environment with required reviewers gives a human approval before this job runs
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check what would change
        run: >
          az deployment group what-if --resource-group "$RESOURCE_GROUP"
          --template-file examples/foundry-cicd/deployments.bicep --parameters accountName="$AI_RESOURCE"

      - name: Deploy the model deployments
        run: >
          az deployment group create --resource-group "$RESOURCE_GROUP"
          --template-file examples/foundry-cicd/deployments.bicep --parameters accountName="$AI_RESOURCE"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Evaluation gate
        run: |
          pip install httpx azure-identity
          python examples/foundry-cicd/eval_gate.py --endpoint "https://$AI_RESOURCE.cognitiveservices.azure.com" \
            --deployment gpt-5.4-mini --min-groundedness 4.0 --min-relevance 4.0
